<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Más Futuro — Consulta de inscripción</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0f1729;--txt:#e8edf8;--txt2:#9fb0d0;--acc:#4f8cff;--line:#2b3960}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;
       -webkit-font-smoothing:antialiased}
  .caja{width:100%;max-width:440px;padding:32px 22px;text-align:center}
  .marca{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;
         color:var(--acc);font-weight:650;margin-bottom:14px}
  h1{font-size:28px;line-height:1.2;margin:0 0 34px;letter-spacing:-.5px;font-weight:680}
  .cta{display:block;background:var(--acc);color:#fff;text-decoration:none;
       padding:19px 24px;border-radius:13px;font-size:18px;font-weight:650;
       box-shadow:0 8px 26px rgba(79,140,255,.28);transition:transform .12s,box-shadow .12s}
  .cta:hover{transform:translateY(-1px);box-shadow:0 11px 32px rgba(79,140,255,.38)}
  .nota{font-size:13.5px;color:var(--txt2);margin-top:14px}
  footer{font-size:12px;color:var(--txt2);margin-top:46px;
         padding-top:18px;border-top:1px solid var(--line)}
  @media (max-width:420px){h1{font-size:24px}}
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">Programa Más Futuro</div>
    <h1>Consulta de inscripción</h1>
    <a class="cta" href="https://script.google.com/macros/s/AKfycbzdfRqfXiGWb-qHcaCSfDTiinUSKftctUJrTGjJM85amN1pF1gckCoxBIl0lyZpbigK/exec">Entrar</a>
    <div class="nota">Necesitás tu código de acceso.</div>
    <footer>Provincia del Chaco</footer>
  </div>
</body>
</html>
